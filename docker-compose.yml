services:
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: logistica_operacional
      MYSQL_USER: dprssd
      MYSQL_PASSWORD: dprssd123
    volumes:
      - ./init-scripts/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bi-network
    ports:
      - "3306:3306"

  postgres-db:
    image: postgres:16
    environment:
      POSTGRES_USER: dprssd
      POSTGRES_PASSWORD: dprssd123
      POSTGRES_DB: gestion_maestra
    volumes:
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bi-network
    ports:
      - "5444:5432"

  staging-db:
    image: postgres:16
    environment:
      POSTGRES_USER: dprssd
      POSTGRES_PASSWORD: dprssd123
      POSTGRES_DB: staging_db
    volumes:
      - ./init-scripts/staging-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bi-network
    ports:
      - "5450:5432"

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - bi-network

networks:
  bi-network:
    driver: bridge